<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 1140" width="1044" height="1140">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#4b1d2a"/>
      <rect width="7" height="16" fill="#e0707f"/>
    </pattern>
    <pattern id="steps" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#243a52"/>
      <rect width="10" height="4" fill="#a9bdd3"/>
    </pattern>
    <g id="bld">
      <rect x="-30" y="182" width="285" height="165" rx="6"/>
      <rect x="718" y="98" width="60" height="175" rx="5"/>
      <rect x="78" y="420" width="72" height="470" rx="5"/>
      <path d="M212 422H270V492H294V886H190V516H212Z"/>
      <rect x="347" y="400" width="393" height="65" rx="5"/>
      <rect x="347" y="400" width="72" height="545" rx="5"/>
      <rect x="362" y="930" width="573" height="86" rx="5"/>
      <rect x="870" y="885" width="65" height="60" rx="5"/>
      <rect x="-30" y="938" width="312" height="68" rx="5"/>
    </g>
    <g id="red">
      <rect x="284" y="345" width="412" height="57" rx="3"/>
      <rect x="281" y="370" width="60" height="530" rx="3"/>
      <rect x="451" y="232" width="80" height="113" rx="3"/>
    </g>
  </defs>

  <!-- 바탕 -->
  <rect width="1044" height="1140" fill="#0d1620"/>

  <!-- 경인로 -->
  <polygon points="0,1088 1044,983 1044,1105 0,1212" fill="#17222e"/>
  <path d="M0 1150L1044 1044" stroke="#c9a26a" stroke-width="3" stroke-dasharray="22 16" fill="none" opacity="0.55"/>

  <!-- 낮은 지대 -->
  <polygon points="0,935 347,935 347,400 960,400 960,1040 0,1062" fill="#1a2f47"/>
  <!-- 오르막 차도 쪽 -->
  <path d="M690 335L990 655L1008 1060" stroke="#1c2d40" stroke-width="44" stroke-linejoin="round" stroke-linecap="butt" fill="none"/>
  <!-- 안뜰 -->
  <rect x="470" y="490" width="415" height="390" rx="30" fill="#21405c"/>
  <!-- 언덕 위 -->
  <polygon points="0,120 700,120 700,400 347,400 347,935 0,935" fill="#463b2d"/>

  <!-- 길 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="30" stroke-linejoin="round">
    <path d="M0 378L690 360"/>
    <path d="M45 378V900"/>
    <path d="M307 400V1070"/>
    <path d="M482 880V505Q482 495 492 495H860Q875 495 875 510V865Q875 880 860 880H482"/>
  </g>

  <!-- 정원 -->
  <rect x="262" y="108" width="268" height="238" rx="40" fill="#2a5a46"/>
  <path d="M248 352L376 247L351 175L436 102L479 162L535 204" fill="none" stroke="#5a4b37" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 안뜰 풀밭 · 농구장 -->
  <g fill="#2a5a46">
    <rect x="505" y="520" width="185" height="110" rx="14"/>
    <rect x="735" y="520" width="105" height="90" rx="14"/>
    <rect x="510" y="660" width="200" height="190" rx="14"/>
    <rect x="740" y="650" width="100" height="95" rx="14"/>
  </g>
  <rect x="748" y="695" width="100" height="140" rx="8" fill="#d98b57"/>
  <path d="M748 765H848" stroke="#fff3df" stroke-width="3" opacity="0.7"/>

  <!-- 건물 -->
  <use href="#bld" fill="#dde6ef" stroke="#9db0c5" stroke-width="5" stroke-linejoin="round"/>
  <use href="#bld" fill="#dde6ef"/>
  <rect x="530" y="13" width="128" height="298" rx="6" fill="#f2c68f" stroke="#fff3df" stroke-width="3"/>

  <!-- 공사 중 -->
  <use href="#red" fill="none" stroke="#e0707f" stroke-width="5" stroke-linejoin="round"/>
  <use href="#red" fill="url(#hatch)"/>

  <!-- 계단 -->
  <rect x="292" y="930" width="30" height="88" fill="url(#steps)"/>
  <rect x="866" y="652" width="72" height="44" fill="url(#steps)"/>

  <!-- 표시물 -->
  <rect x="436" y="880" width="34" height="40" rx="5" fill="#b183e8"/>
  <rect x="800" y="990" width="40" height="34" rx="6" fill="#6f8ef0"/>
  <circle cx="935" cy="435" r="26" fill="#f2c68f" stroke="#0d1620" stroke-width="4"/>

  <!-- 횡단보도 -->
  <g fill="#d3dbe4" opacity="0.9">
    <rect x="487" y="1054" width="60" height="14" rx="3"/>
    <rect x="487" y="1078" width="60" height="14" rx="3"/>
    <rect x="487" y="1102" width="60" height="14" rx="3"/>
    <rect x="487" y="1126" width="60" height="14" rx="3"/>
  </g>
</svg>
