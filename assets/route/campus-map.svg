<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 1104" width="954" height="1104">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#3d1a24"/>
      <rect width="7" height="16" fill="#8f3a48"/>
    </pattern>
    <pattern id="steps-v" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#2a3b50"/>
      <rect width="4" height="9" fill="#5f7590"/>
    </pattern>
    <pattern id="steps-h" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#2a3b50"/>
      <rect width="9" height="4" fill="#5f7590"/>
    </pattern>
    <g id="bld">
      <rect x="5" y="3" width="340" height="185" rx="8"/>
      <rect x="272" y="170" width="45" height="45" rx="6"/>
      <rect x="8" y="330" width="97" height="287" rx="8"/>
      <rect x="200" y="338" width="100" height="282" rx="8"/>
      <rect x="100" y="440" width="105" height="62"/>
      <rect x="70" y="555" width="135" height="62"/>
      <rect x="422" y="335" width="248" height="90" rx="8"/>
      <rect x="422" y="335" width="93" height="415" rx="8"/>
      <rect x="0" y="748" width="760" height="87" rx="8"/>
    </g>
    <g id="red">
      <rect x="407" y="242" width="318" height="93" rx="4"/>
      <rect x="297" y="324" width="125" height="300" rx="4"/>
      <rect x="670" y="310" width="55" height="122" rx="4"/>
    </g>
  </defs>

  <!-- 바탕 -->
  <rect width="954" height="1104" fill="#0b121a"/>

  <!-- 차도 -->
  <rect x="0" y="950" width="954" height="154" fill="#16202b"/>
  <rect x="790" y="395" width="125" height="560" fill="#16202b"/>
  <path d="M852 410V940" stroke="#2a3846" stroke-width="3" stroke-dasharray="16 14" fill="none"/>
  <path d="M0 1030H420M540 1030H954" stroke="#2a3846" stroke-width="3" stroke-dasharray="16 14" fill="none"/>

  <!-- 낮은 지대(지하 2층 높이) -->
  <g fill="#22344a">
    <rect x="5" y="835" width="785" height="115"/>
    <rect x="515" y="395" width="275" height="450"/>
    <rect x="915" y="392" width="39" height="558"/>
  </g>

  <!-- 언덕 위(3층 높이) -->
  <rect x="0" y="188" width="422" height="562" fill="#463e31"/>

  <!-- 정원 -->
  <rect x="343" y="0" width="222" height="242" rx="10" fill="#2f5a3d"/>
  <g fill="none" stroke="#463e31" stroke-width="34">
    <path d="M392 202L447 152V34H548V242"/>
    <path d="M447 147H548"/>
  </g>

  <!-- 안뜰 풀밭 -->
  <g fill="#2f5a3d">
    <rect x="593" y="475" width="83" height="202" rx="6"/>
    <rect x="723" y="477" width="35" height="41" rx="5"/>
    <rect x="726" y="558" width="32" height="185" rx="5"/>
  </g>
  <rect x="723" y="522" width="37" height="34" fill="url(#steps-v)"/>

  <!-- 건물 -->
  <use href="#bld" fill="#34465c" stroke="#566b84" stroke-width="5" stroke-linejoin="round"/>
  <use href="#bld" fill="#34465c"/>

  <!-- 유재라관(8호관) -->
  <rect x="565" y="2" width="160" height="240" rx="8" fill="#3b5069" stroke="#e0a671" stroke-width="3"/>

  <!-- 계단만 있는 별도 공간 -->
  <ellipse cx="273" cy="858" rx="78" ry="64" fill="url(#steps-h)" stroke="#6f86a1" stroke-width="3"/>

  <!-- 공사 중 -->
  <use href="#red" fill="none" stroke="#b9515f" stroke-width="5" stroke-linejoin="round"/>
  <use href="#red" fill="url(#hatch)"/>

  <!-- 주차장 -->
  <rect x="778" y="181" width="139" height="214" rx="8" fill="#243a5c" stroke="#4a6a99" stroke-width="3"/>

  <!-- 표시물 -->
  <rect x="476" y="693" width="40" height="44" rx="5" fill="#a76fcf"/>
  <rect x="575" y="898" width="76" height="43" rx="6" fill="#7f78d6"/>
  <circle cx="930" cy="460" r="15" fill="#e0a671" stroke="#0b121a" stroke-width="3"/>

  <!-- 횡단보도 -->
  <g fill="#b9c3ce" opacity="0.85">
    <rect x="432" y="965" width="88" height="22" rx="3"/>
    <rect x="432" y="997" width="88" height="22" rx="3"/>
    <rect x="432" y="1029" width="88" height="22" rx="3"/>
    <rect x="432" y="1061" width="88" height="22" rx="3"/>
    <rect x="798" y="886" width="18" height="56" rx="3"/>
    <rect x="824" y="886" width="18" height="56" rx="3"/>
    <rect x="850" y="886" width="18" height="56" rx="3"/>
    <rect x="884" y="886" width="18" height="56" rx="3"/>
    <rect x="763" y="795" width="152" height="22" rx="3" opacity="0.7"/>
  </g>
</svg>
